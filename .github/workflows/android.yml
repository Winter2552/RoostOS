# Builds the Roost Backup Android app and keeps the APK for download.
# Open the run, then "Artifacts" at the bottom, and download roost-backup-apk.
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roost-backup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
