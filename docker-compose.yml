# Roost homepage. On ZimaOS: App Store → Custom Install → Import, and paste this file.
# For now it builds from this folder; once an image is published, swap `build: .` for `image:`.
name: roost

services:
  roost:
    build: .
    container_name: roost
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Set to "true" only when Roost is served over HTTPS (e.g. through Tailscale serve).
      SECURE_COOKIES: "false"
      # Drives on the status page, as Label=path inside the container; the paths are
      # the read-only mounts below. Without this, Roost shows the drive it runs on.
      ROOST_DISKS: "System=/hostfs/system;Data=/hostfs/data"
    volumes:
      # On ZimaOS this keeps Roost's accounts and app list with the other app data.
      - /DATA/AppData/roost:/data
      # Read-only, only so the status page can see how full each drive is.
      # /DATA is on the system SSD. Point the second line at the 3 TB data drive's
      # mount folder (ZimaOS shows it under Storage); until then it repeats /DATA
      # and the status page lists a single drive.
      - /DATA:/hostfs/system:ro
      - /DATA:/hostfs/data:ro
