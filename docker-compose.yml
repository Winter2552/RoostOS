# Roost homepage. On ZimaOS: App Store → Custom Install → Import, and paste this file.
# For now it builds from this folder; once an image is published, swap `build: .` for `image:`.
name: roost

services:
  roost:
    build: .
    container_name: roost
    restart: unless-stopped
    ports:
      - "8080:8080"
      # HTTPS, once a certificate is set up under Admin → Secure connection.
      - "443:8443"
    environment:
      PORT: "8080"
      HTTPS_PORT: "8443"
      DATA_DIR: /data
      # Sign-in cookies are marked Secure automatically on HTTPS; "true" forces it on plain HTTP too.
      SECURE_COOKIES: "false"
      # Set to "true" only when Roost is reached through a tunnel or reverse proxy, so the
      # Admin activity log shows each visitor's real address instead of the proxy's.
      BEHIND_PROXY: "false"
      # Shared secret Nest and Glint use to read limits and report usage. Leave blank until they exist.
      ROOST_APP_TOKEN: ""
      # Drives on the status page, as Label=path inside the container; the paths are
      # the read-only mounts below. Without this, Roost shows the drive it runs on.
      ROOST_DISKS: "System=/hostfs/system;Data=/hostfs/data"
      # Where Nest keeps everyone's files (the mount below).
      NEST_DIR: /nest
      # The backup drive, read-only (the mount below), so Admin → Backups can
      # browse backups and get files back out of them.
      BACKUP_DIR: /backup
      # Container status and restarts go through roost-docker below, Roost's own
      # helper. Remove both to fall back to web checks (and no Restart buttons).
      DOCKER_HOST: tcp://roost-docker:2375
      # Drive health readings from the roost-smart service below (the read-only mount).
      SMART_DIR: /smart
    depends_on:
      - roost-docker
    volumes:
      # On ZimaOS this keeps Roost's accounts and app list with the other app data.
      - /DATA/AppData/roost:/data
      # Nest's files, as normal folders: one per user. Point the left side at a
      # folder on the 3 TB data drive (ZimaOS shows its mount under Storage).
      - /DATA/roost-nest:/nest
      # The backup drive, read-only. Same folder as the roost-backup service's
      # /backup line below.
      - /media/Backup:/backup:ro
      # Read-only, only so the status page can see how full each drive is.
      # /DATA is on the system SSD. Point the second line at the 3 TB data drive's
      # mount folder (ZimaOS shows it under Storage); until then it repeats /DATA
      # and the status page lists a single drive.
      - /DATA:/hostfs/system:ro
      - /DATA:/hostfs/data:ro
      - smart:/smart:ro

  # Nightly backups (Roost Snapshots) to a drive plugged into the server. Same
  # image as Roost, different start command. It reads Nest and the apps'
  # settings read-only and writes only to the backup drive.
  roost-backup:
    build: .
    container_name: roost-backup
    restart: unless-stopped
    command: ["node", "src/backup-service.js"]
    # The Roost image checks its web page for health; this service has none.
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backup
      NEST_DIR: /source/nest
      APPDATA_DIR: /source/appdata
      # Your time zone, so backups run at your time of day (set the time in
      # Admin → Backups), e.g. Europe/London.
      TZ: "Etc/UTC"
    volumes:
      # Roost's data: backed up too, and where this service reports to Roost.
      - /DATA/AppData/roost:/data
      # The same folders as the Nest line above, read-only.
      - /DATA/roost-nest:/source/nest:ro
      # Every app's settings (Jellyfin users and watch history and so on).
      # Caches, transcodes and logs are skipped. Films and shows live
      # elsewhere and aren't backed up.
      - /DATA/AppData:/source/appdata:ro
      # The backup drive. Point the left side at the USB SSD's mount folder
      # (ZimaOS shows it under Storage). Until then backups wait: Roost
      # never backs up onto the drive the data is on.
      - /media/Backup:/backup
      # Only to bring a whole backup back after the server was lost: take the #
      # off the next line, redeploy, and see "Bringing a backup back" in the README.
      # - /DATA/restored:/restore

  # Roost's own narrow window onto Docker (src/docker-helper.js), built from the
  # same code. It lets Roost read the container list and restart only the
  # containers named below; it refuses starting, stopping, removing, exec and
  # everything else. No ports: only Roost can reach it.
  roost-docker:
    build: .
    container_name: roost-docker
    restart: unless-stopped
    command: ["node", "src/docker-helper.js"]
    environment:
      # Containers admins may restart from the status page, comma separated.
      # Use the names ZimaOS shows for each app. Roost itself is never offered.
      ROOST_RESTARTABLE: "jellyfin"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Drive health: once an hour, reads each drive's SMART data (temperature,
  # errors, wear) with smartctl and leaves it in the smart volume for Roost.
  # It has no network at all. Drives that are asleep are left asleep.
  roost-smart:
    build: ./smart
    container_name: roost-smart
    restart: unless-stopped
    network_mode: none
    # smartctl needs raw access to read SMART; this is all it is given.
    cap_add:
      - SYS_RAWIO
    devices:
      # The system SSD. ZimaOS shows each drive's name under Storage.
      - /dev/sda:/dev/sda
      # The 3 TB data drive: remove the # once it is installed. A line for a
      # drive that isn't there stops this service from starting.
      # - /dev/sdb:/dev/sdb
    volumes:
      - smart:/out

volumes:
  smart:
