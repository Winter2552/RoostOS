# Roost homepage. On ZimaOS: App Store → Custom Install → Import, and paste this file.
# For now it builds from this folder; once an image is published, swap `build: .` for `image:`.
name: roost

services:
  roost:
    build: .
    container_name: roost
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Set to "true" only when Roost is served over HTTPS (e.g. through Tailscale serve).
      SECURE_COOKIES: "false"
      # Set to "true" only when Roost is reached through a tunnel or reverse proxy, so the
      # Admin activity log shows each visitor's real address instead of the proxy's.
      BEHIND_PROXY: "false"
      # Shared secret Nest and Glint use to read limits and report usage. Leave blank until they exist.
      ROOST_APP_TOKEN: ""
      # Drives on the status page, as Label=path inside the container; the paths are
      # the read-only mounts below. Without this, Roost shows the drive it runs on.
      ROOST_DISKS: "System=/hostfs/system;Data=/hostfs/data"
      # Where Nest keeps everyone's files (the mount below).
      NEST_DIR: /nest
      # Container status and restarts go through roost-docker below, Roost's own
      # helper. Remove both to fall back to web checks (and no Restart buttons).
      DOCKER_HOST: tcp://roost-docker:2375
    depends_on:
      - roost-docker
    volumes:
      # On ZimaOS this keeps Roost's accounts and app list with the other app data.
      - /DATA/AppData/roost:/data
      # Nest's files, as normal folders: one per user. Point the left side at a
      # folder on the 3 TB data drive (ZimaOS shows its mount under Storage).
      - /DATA/roost-nest:/nest
      # Read-only, only so the status page can see how full each drive is.
      # /DATA is on the system SSD. Point the second line at the 3 TB data drive's
      # mount folder (ZimaOS shows it under Storage); until then it repeats /DATA
      # and the status page lists a single drive.
      - /DATA:/hostfs/system:ro
      - /DATA:/hostfs/data:ro

  # Roost's own narrow window onto Docker (src/docker-helper.js), built from the
  # same code. It lets Roost read the container list and restart only the
  # containers named below; it refuses starting, stopping, removing, exec and
  # everything else. No ports: only Roost can reach it.
  roost-docker:
    build: .
    container_name: roost-docker
    restart: unless-stopped
    command: ["node", "src/docker-helper.js"]
    environment:
      # Containers admins may restart from the status page, comma separated.
      # Use the names ZimaOS shows for each app. Roost itself is never offered.
      ROOST_RESTARTABLE: "jellyfin"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
